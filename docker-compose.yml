name: highway-speed-enforcement

# Two of the three applications run here. The WPF client runs on the Windows host
# and connects to the processor's REST port published below.
#
# Ports 5080/5081 are used on the host as well as inside the containers, so the
# same address (http://localhost:5080) works whether the processor runs here or
# via `dotnet run`.
services:

  processor:
    build:
      context: .
      dockerfile: src/HighwaySpeed.Processor/Dockerfile
    image: highwayspeed-processor
    ports:
      - "5080:5080"   # REST  – WPF client polls GET /api/traffic-snapshot
      - "5081:5081"   # gRPC  – generator streams telemetry
    environment:
      DOTNET_ENVIRONMENT: Production

  generator:
    build:
      context: .
      dockerfile: src/HighwaySpeed.Generator/Dockerfile
    image: highwayspeed-generator
    depends_on:
      - processor
    environment:
      DOTNET_ENVIRONMENT: Production
      # Reach the processor over the compose network by service name.
      # If the processor is still starting, the generator retries with back-off.
      Generator__ProcessorGrpcAddress: "http://processor:5081"
