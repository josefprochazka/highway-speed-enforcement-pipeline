name: highway-speed-enforcement

# Only the processor is a Docker service per the assignment spec. The generator
# (console app) and the WPF client (desktop app) both run natively on the host
# and reach this container's published ports.
services:

  processor:
    build:
      context: .
      dockerfile: src/HighwaySpeed.Processor/Dockerfile
    image: highwayspeed-processor
    ports:
      - "5080:5080"   # REST  – WPF client polls GET /api/traffic-snapshot
      - "5081:5081"   # gRPC  – generator streams telemetry
    environment:
      DOTNET_ENVIRONMENT: Production
